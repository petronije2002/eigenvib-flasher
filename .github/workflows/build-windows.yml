name: build-windows-flasher

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest          # a real Windows x64 runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'        # -> an x64 .exe (what the operator's PC needs)

      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install esptool==4.12.0 pyserial==3.5 segno==1.6.6 "pillow>=10.2" pyinstaller

      - name: Build EigenVib-Flasher.exe
        run: >
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --name EigenVib-Flasher --collect-data esptool
          --add-data "firmware;firmware" eigenvib_flasher_gui.py

      - name: Show output size (sanity)
        run: dir dist

      - name: Upload the .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: EigenVib-Flasher-windows-x64
          path: dist/EigenVib-Flasher.exe
          if-no-files-found: error
