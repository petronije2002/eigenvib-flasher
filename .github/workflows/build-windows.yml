name: build-windows-flasher

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest          # a real Windows x64 runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'        # -> an x64 .exe (what the operator's PC needs)

      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install esptool==4.12.0 pyserial==3.5 segno==1.6.6 "pillow>=10.2" pyinstaller

      # Read the version OUT OF the firmware image (ESP-IDF stamps it from version.txt
      # into the app descriptor). Never typed here: a label beside a binary drifts the
      # first time someone forgets to update it.
      - name: Read the bundled firmware version
        id: fw
        shell: bash
        run: echo "version=$(python fw_version.py)" >> "$GITHUB_OUTPUT"

      - name: Build EigenVib-Flasher-${{ steps.fw.outputs.version }}.exe
        run: >
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --name EigenVib-Flasher-${{ steps.fw.outputs.version }} --collect-data esptool
          --add-data "firmware;firmware" eigenvib_flasher_gui.py

      - name: Show output size (sanity)
        run: dir dist

      - name: Upload the .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: EigenVib-Flasher-${{ steps.fw.outputs.version }}-windows-x64
          path: dist/EigenVib-Flasher-${{ steps.fw.outputs.version }}.exe
          if-no-files-found: error
